<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume | Tilothama Nunna</title>
<link rel="stylesheet" href="style.css">

<style>
.resume-section{
    max-width:600px;
    margin:auto;
    text-align:center;
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:20px;
}

.form-box{
    background:var(--card-bg,#fff);
    padding:40px;
    border-radius:12px;
    border:1px solid var(--border,#ddd);
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.input-field{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
    box-sizing:border-box;
}

.input-field:focus{
    outline:none;
    border-color:#007bff;
}

.field-error{
    color:red;
    font-size:12px;
    display:none;
}

.btn.primary{
    background:#007bff;
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
}

#resume-content{
    display:none;
}
</style>
</head>

<body>

<nav class="container-wide">
    <div class="logo"><strong>TN</strong></div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html" class="active">Resume</a>
        <a href="contact.html">Contact</a>
        <button id="theme-btn">◐</button>
    </div>
</nav>

<section class="resume-section">

<div id="resume-form" class="form-box">

    <h2>Unlock Full Resume</h2>
    <p>Enter your details to continue</p>

    <form id="resume-form-element">

        <input
            type="text"
            id="res-name"
            class="input-field"
            placeholder="Full Name"
        >
        <div class="field-error" id="name-error"></div>

        <input
            type="email"
            id="res-email"
            class="input-field"
            placeholder="Email Address"
        >
        <div class="field-error" id="email-error"></div>

        <button
            type="submit"
            id="submit-btn"
            class="btn primary">
            View Resume
        </button>

    </form>

</div>

<div id="resume-content">

    <h2 style="color:#007bff;">Access Granted</h2>

    <p>You can now download your resume.</p>

    <a
        href="resume/Tilothama_Nunna_Resume.pdf"
        target="_blank"
        class="btn primary"
        style="display:inline-block;margin-top:20px;">
        Download Resume
    </a>

</div>

</section>

<script>

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxVvLKNIvAvznsrItMDZgj9q1dggDOlrSkZfsWokcP8bvdXF5TQWb1-uG61ucb8vNbH/exec";

function showResume(){
document.getElementById("resume-form").style.display="none";
document.getElementById("resume-content").style.display="block";
}

document
.getElementById("resume-form-element")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const name =
document.getElementById("res-name")
.value
.trim();

const email =
document.getElementById("res-email")
.value
.trim();

if(!name || !email){
alert("Fill all fields");
return;
}

const btn =
document.getElementById("submit-btn");

btn.disabled=true;
btn.innerText="Processing...";

try{

await fetch(
SHEET_URL,
{
method:"POST",
mode:"no-cors",

headers:{
"Content-Type":"text/plain"
},

body:JSON.stringify({
name,
email
})
}
);

setTimeout(()=>{
showResume();
},1000);

}
catch(err){

alert("Submission failed");

btn.disabled=false;

btn.innerText=
"View Resume";

console.log(err);

}

});

</script>
</body>
</html>
